# Version catalog for swing-mcp.
# Versions verified against Maven Central / Gradle Plugin Portal on 2026-07-03.
[versions]
# Java MCP SDK (io.modelcontextprotocol.sdk). 2.0.0 is the current release.
mcp = "2.0.0"
# Jetty 12.1.x — the EE10 servlet stack (Servlet 6 / jakarta.servlet 6.x).
jetty = "12.1.10"
# JUnit 5.x (Jupiter). 5.14.4 is the latest 5.x line; JUnit 6.x exists but the
# plan pins the 5.x series, so we track the newest 5.x release.
junit = "5.14.4"
# Shadow (fat-jar + relocation) — maintained fork at com.gradleup.shadow.
shadow = "9.4.3"
# Foojay toolchain resolver — auto-provisions JDK toolchains when not installed.
foojay = "1.0.0"
# Kotlin JVM — used ONLY by the demo-kotlin module (proves Kotlin-authored Swing UIs need
# nothing special). The agent/core stay pure Java so no kotlin-stdlib is ever shaded into a
# host app. 2.2.20 is a current stable 2.x with Gradle 9 support.
kotlin = "2.2.20"

[libraries]
# --- MCP SDK ---
# The umbrella `mcp` artifact pulls in mcp-core + mcp-json-jackson3 (Jackson 3).
mcp = { module = "io.modelcontextprotocol.sdk:mcp", version.ref = "mcp" }

# --- Embedded HTTP server (agent transport) ---
jetty-ee10-servlet = { module = "org.eclipse.jetty.ee10:jetty-ee10-servlet", version.ref = "jetty" }

# --- Testing ---
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
