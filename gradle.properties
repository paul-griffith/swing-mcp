# Build performance defaults.
org.gradle.parallel=true
org.gradle.caching=true

# Java toolchain version used to compile & run tests. Bytecode is always Java 17
# (options.release = 17); this only controls which JVM runs the compiler and tests, so CI
# can exercise the build on 17 and 25 by overriding, e.g. -Pswingmcp.javaVersion=25.
swingmcp.javaVersion=17
