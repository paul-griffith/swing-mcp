name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }}, temurin ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        java: [ '17', '25' ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the matrix JDK. Gradle uses it both as the daemon JVM and to satisfy the
      # requested toolchain (-Pswingmcp.javaVersion), so tests actually run on 17 and 25.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Xvfb provides a virtual display for the headed tests on Linux: the core headed
      # integration tests and the e2e suite (which forks the demo apps + shaded agent and
      # drives them over MCP). Headless unit tests do not need it. `./gradlew build` runs the
      # e2e module's tests via check → test, so the whole end-to-end suite executes here.
      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build & test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./gradlew build -Pswingmcp.javaVersion=${{ matrix.java }} --stacktrace

      - name: Build & test (macOS)
        if: runner.os != 'Linux'
        run: ./gradlew build -Pswingmcp.javaVersion=${{ matrix.java }} --stacktrace

      - name: Verify shaded agent jar
        run: ./gradlew :agent:shadowJar -Pswingmcp.javaVersion=${{ matrix.java }} --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}-java${{ matrix.java }}
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
