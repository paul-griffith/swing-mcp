name: release

# Push a tag matching the build version (e.g. v1.0.0) to publish swing-mcp-agent.jar.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: true

      - name: Check tag matches build version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match build version $version"
            exit 1
          fi

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build & test
        run: xvfb-run --auto-servernum ./gradlew build --stacktrace

      - name: Checksum
        working-directory: agent/build/libs
        run: sha256sum swing-mcp-agent.jar > swing-mcp-agent.jar.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            agent/build/libs/swing-mcp-agent.jar \
            agent/build/libs/swing-mcp-agent.jar.sha256 \
            --title "$TAG" --generate-notes --verify-tag
