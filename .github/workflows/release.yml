name: release

# Push a tag matching the build version (e.g. v1.0.0) to publish swing-mcp-agent.jar.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Check tag matches build version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match build version $version"
            exit 1
          fi

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build & test
        run: xvfb-run --auto-servernum ./gradlew build --stacktrace

      - name: Checksum
        working-directory: agent/build/libs
        run: sha256sum swing-mcp-agent.jar > swing-mcp-agent.jar.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            agent/build/libs/swing-mcp-agent.jar \
            agent/build/libs/swing-mcp-agent.jar.sha256 \
            --title "$TAG" --generate-notes --verify-tag
